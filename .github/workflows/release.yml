name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build release binary
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        run: sudo apt-get install -y musl-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Strip binary
        run: strip target/x86_64-unknown-linux-musl/release/init

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-musl/release
          tar czf smoljail-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz init
          sha256sum smoljail-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz \
            > smoljail-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz.sha256

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/x86_64-unknown-linux-musl/release/smoljail-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz
            target/x86_64-unknown-linux-musl/release/smoljail-${{ github.ref_name }}-x86_64-unknown-linux-musl.tar.gz.sha256
